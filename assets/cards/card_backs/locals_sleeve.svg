<svg xmlns="http://www.w3.org/2000/svg" width="320" height="455" viewBox="0 0 320 455">
  <title>Locals charcoal card sleeve</title>
  <desc>Editable cream and muted gold printing on charcoal, with three overlapping colored cards and an original LOCALS wordmark.</desc>
  <!-- Physical sleeve: a quiet near-black edge and solid charcoal face. -->
  <rect x="2" y="2" width="316" height="451" rx="15" fill="#171A20" stroke="#0D1115" stroke-width="4"/>
  <rect x="7" y="7" width="306" height="441" rx="11" fill="#242A31" stroke="#45494A" stroke-width="1.5"/>
  <path d="M19 9H301Q311 9 311 20V434" fill="none" stroke="#626365" stroke-opacity=".38" stroke-width="1"/>

  <!-- Three fine printed frames. Corners have ordinary bookplate detail. -->
  <rect x="15" y="15" width="290" height="425" rx="8" fill="none" stroke="#C2B490" stroke-width="1.5" stroke-opacity=".85"/>
  <rect x="21" y="21" width="278" height="413" rx="5" fill="none" stroke="#EFE4CB" stroke-width="1" stroke-opacity=".48"/>
  <path d="M43 28H277Q277 43 292 43V412Q277 412 277 427H43Q43 412 28 412V43Q43 43 43 28Z" fill="none" stroke="#B6A783" stroke-width="1" stroke-opacity=".76"/>
  <g fill="none" stroke="#D8C8A1" stroke-width="1.25" stroke-linecap="round" opacity=".83">
    <path d="M29 62V49Q49 49 49 29H66M254 29H271Q271 49 291 49V62"/>
    <path d="M29 393V406Q49 406 49 426H66M254 426H271Q271 406 291 406V393"/>
  </g>
  <g fill="#D8C8A1" opacity=".74">
    <circle cx="39" cy="39" r="1.5"/><circle cx="281" cy="39" r="1.5"/>
    <circle cx="39" cy="416" r="1.5"/><circle cx="281" cy="416" r="1.5"/>
  </g>

  <!-- An original fan of three printed cards; no character or robot emblem. -->
  <g transform="translate(160 189)">
    <g transform="rotate(-20)">
      <rect x="-49" y="-35" width="43" height="64" rx="3" fill="#15191E" transform="translate(1 3)"/>
      <rect x="-49" y="-35" width="43" height="64" rx="3" fill="#64867C" stroke="#E9DDC2" stroke-width="2"/>
      <rect x="-44" y="-29" width="33" height="45" rx="1" fill="none" stroke="#E9DDC2" stroke-opacity=".48" stroke-width="1"/>
      <path d="M-42 22H-13" stroke="#E9DDC2" stroke-opacity=".72" stroke-width="1.5"/>
    </g>
    <g transform="rotate(19)">
      <rect x="5" y="-38" width="43" height="64" rx="3" fill="#15191E" transform="translate(1 3)"/>
      <rect x="5" y="-38" width="43" height="64" rx="3" fill="#B19759" stroke="#E9DDC2" stroke-width="2"/>
      <rect x="10" y="-32" width="33" height="45" rx="1" fill="none" stroke="#E9DDC2" stroke-opacity=".48" stroke-width="1"/>
      <path d="M12 19H41" stroke="#E9DDC2" stroke-opacity=".72" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-3)">
      <rect x="-22" y="-40" width="44" height="65" rx="3" fill="#15191E" transform="translate(2 3)"/>
      <rect x="-22" y="-40" width="44" height="65" rx="3" fill="#B6695D" stroke="#F0E4C9" stroke-width="2"/>
      <rect x="-16" y="-34" width="32" height="44" rx="1" fill="none" stroke="#EEDFC0" stroke-opacity=".58" stroke-width="1"/>
      <path d="M-13 17H13" stroke="#F0E4C9" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Outlined letter paths keep the wordmark identical in SVG/Godot renders. -->
  <g transform="translate(42 236)" fill="#F0E5CF">
    <!-- L -->
    <path d="M0 0H10V33H30V43H0Z"/>
    <!-- O -->
    <path fill-rule="evenodd" d="M44 0H58Q69 0 69 11V32Q69 43 58 43H44Q33 43 33 32V11Q33 0 44 0ZM46 10Q43 10 43 13V30Q43 33 46 33H56Q59 33 59 30V13Q59 10 56 10Z"/>
    <!-- C -->
    <path d="M87 0H108V10H89Q86 10 86 13V30Q86 33 89 33H108V43H87Q76 43 76 32V11Q76 0 87 0Z"/>
    <!-- A -->
    <path fill-rule="evenodd" d="M125 0H137L153 43H142L139 34H123L120 43H109ZM131 11L126 25H136Z"/>
    <!-- L -->
    <path d="M159 0H169V33H190V43H159Z"/>
    <!-- S -->
    <path d="M205 0H235V10H207Q204 10 204 13V14Q204 17 207 17H223Q235 17 235 29V31Q235 43 223 43H194V33H222Q225 33 225 30V29Q225 26 222 26H206Q194 26 194 14V12Q194 0 205 0Z"/>
  </g>
  <g fill="none" stroke="#CAB88F" stroke-linecap="round" opacity=".67">
    <path d="M83 296H145M175 296H237" stroke-width="1"/>
    <path d="M149 296H171" stroke-width="2"/>
  </g>
  <path d="M156 294L160 290L164 294L160 298Z" fill="#CAB88F"/>
</svg>
